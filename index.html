<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tek-x-proceed</title>
     <!--  style -->
    <link rel="stylesheet" href="style.css">

    <!--  BOX ICON-->
    <link rel="stylesheet" href="boxicons.min.css">
</head>
<body>
    <nav class="nav">
        <div class="logo-search">
            <div class="wrap">
                <img src="yyy.png" alt="tek-x-logo" class="nav-logo">
                <form action="">
                    <input type="text">
                    <button type="submit"><i class="bx bx bx-search" aria-hidden="true"></i></button>
                </form>
            </div>
            <div class="inout">
                <a href="#" class="sign">Sign in</a>
                <a href="#" class="sign">Sign out</a>
            </div>
        </div>
    </nav>
<section class="wrapper">
    <div class="svg">
        <img src="tek-x.svg" alt="" class="up">
        <div class="icon-area">
            <div class="icon">
                <img src="bxs-check-circle.svg" alt="icon">
                <p class="user"><span>Hurry!!!</span><br>Verification Successful</p>
            </div>

        </div>

    </div>
    <div class="upper">
        <div class="info">
            <p class="name">Name</p>
            <input type="text" placeholder="Umar dwtree" class="name-input">
            <p class="phone">Phone Number</p>
            <input type="tel" placeholder="+111" class="phone-input">
            <p class="birth-paragraph">Date of birth</p>
            <input type="date" placeholder="20/10/1111" class="date-input">
            <p class="gender-paragraph">Gender</p>
            <input type="name" placeholder="female/male" class="gender-input">
           
            <div class="end">
                <div class="check">
                    <input type="checkbox" class="checkbox" id="checkbox">
                    <label for="checkbox">I agree that the above data is correct</label>
                </div>
                <div class="buttons-control">
                    <a class="proceed" href="sign-up.html">proceed</a>
                </div>
            </div>
        </div>
    </div>
</section>
    
</body>
</html>
