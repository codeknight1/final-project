<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TEK-X</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         DESKTOP / TABLET NAVBAR
         ===================================================== -->
    <header class="navbar">

        <div class="logo-search-container">

            <a
                href="#"
                class="logo-small"
                aria-label="TEK-X home"
            >
                <img
                    src="Assert/image/yyy.png"
                    alt="TEK-X Logo"
                >
            </a>

            <div
                class="search-box"
                role="search"
            >
                <i
                    class="fa-solid fa-magnifying-glass"
                    aria-hidden="true"
                ></i>

                <input
                    type="search"
                    placeholder="Search"
                    aria-label="Search"
                >
            </div>

        </div>

        <div class="nav-actions">

            <a
                href="#"
                class="nav-link"
            >
                Sign out
            </a>

        </div>

    </header>


    <!-- =====================================================
         MAIN HERO
         ===================================================== -->
    <main class="hero">

        <!-- =================================================
             MOBILE DECORATIVE EDGE IMAGE

             IMPORTANT:
             This image is intentionally hidden on desktop
             and displayed only on mobile through CSS.
             ================================================= -->
        <div
            class="corner-image"
            aria-hidden="true"
        >
            <img
                src="Assert/svg/tek-x.svg"
                alt=""
            >
        </div>


        <!-- =================================================
             MAIN TEK-X LOGO
             ================================================= -->
        <div class="logo-large">

            <img
                src="Assert/image/mmm.png"
                alt="TEK-X"
            >

        </div>


        <!-- =================================================
             AUTHENTICATION BUTTONS
             ================================================= -->
        <div class="buttons">

            <a
                href="#"
                class="btn btn-primary"
            >
                SIGN IN
            </a>

            <a
                href="#"
                class="btn btn-outline"
            >
                SIGN UP
            </a>

        </div>

    </main>

</body>
</html>
